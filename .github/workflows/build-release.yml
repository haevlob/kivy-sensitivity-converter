name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > sensitivityconverter.keystore

      - name: Build Release APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -e P4A_RELEASE_KEYSTORE=/home/user/hostcwd/sensitivityconverter.keystore \
            -e P4A_RELEASE_KEYSTORE_PASSWD=${{ secrets.KEYSTORE_PASSWORD }} \
            -e P4A_RELEASE_KEYALIAS=${{ secrets.KEY_ALIAS }} \
            -e P4A_RELEASE_KEYALIAS_PASSWD=${{ secrets.KEY_PASSWORD }} \
            ghcr.io/kivy/buildozer:latest \
            android release

      - name: Prepare APK for Release
        id: prepare
        run: |
          APK_PATH=$(ls bin/*.apk | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          VERSION=$(grep -oP 'version = \K[0-9.]+' buildozer.spec || echo "1.1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Delete old release (if exists)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ steps.prepare.outputs.version }}" --yes || true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            Автоматическая сборка приложения для конвертации чувствительности между Standoff 2, PUBG Mobile и Call of Duty Mobile.

            📱 **Скачай APK ниже и установи на Android** (разреши установку из неизвестных источников).

            Изменения: обновлённая сборка с поддержкой нескольких языков, точной конвертацией сенсы и гироскопа.

            © 2026 Taysin Dim
        run: |
          echo "$RELEASE_NOTES" > release_notes.md

          gh release create "${{ steps.prepare.outputs.tag }}" \
            --title "Mobile Games Sens Converter ${{ steps.prepare.outputs.version }}" \
            --notes-file release_notes.md \
            "${{ steps.prepare.outputs.apk_path }}"

      - name: Upload Artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: sensitivityconverter-release-apk
          path: bin/*.apk

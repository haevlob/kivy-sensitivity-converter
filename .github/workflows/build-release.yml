name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > sensitivityconverter.keystore

      - name: Build Release APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android release
          buildozer_version: stable
          args: --no-set-owner   # обход проблем с правами

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: sensitivityconverter-release-apk
          path: bin/*.apk

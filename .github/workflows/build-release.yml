name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > sensitivityconverter.keystore

      - name: Build Release APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -e P4A_RELEASE_KEYSTORE=/home/user/hostcwd/sensitivityconverter.keystore \
            -e P4A_RELEASE_KEYSTORE_PASSWD=${{ secrets.KEYSTORE_PASSWORD }} \
            -e P4A_RELEASE_KEYALIAS=${{ secrets.KEY_ALIAS }} \
            -e P4A_RELEASE_KEYALIAS_PASSWD=${{ secrets.KEY_PASSWORD }} \
            ghcr.io/kivy/buildozer:latest \
            android release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: sensitivityconverter-release-apk
          path: bin/*.apk
